[build-system]
requires      = ["maturin>=1.4,<2"]
build-backend = "maturin"

[project]
name = "infercnasc"
version = "0.2.0"
description = "Copy number alteration inference from single-cell RNA-seq data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["bioinformatics", "single-cell", "genomics", "CNA", "scRNA-seq"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "anndata>=0.10",
    "requests-cache>=1.1",
    "matplotlib>=3.7",
    "platformdirs>=4.0",
]

[tool.maturin]
python-source = "python"
module-name   = "infercnasc._core"
bindings      = "pyo3"
features      = ["python"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that download external data or otherwise touch the network",
]
