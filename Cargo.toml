[package]
name        = "infercnasc"
version     = "0.1.0"
edition     = "2021"
description = "Copy number alteration inference from scRNA-seq data"
license     = "MIT"
repository  = "https://github.com/alejandro-soto-franco/inferCNAsc"
keywords      = ["bioinformatics", "single-cell", "genomics", "CNA"]
categories    = ["science"]
documentation = "https://docs.rs/infercnasc"
exclude       = ["python/", "notebooks/", "tests/", ".github/", "docs/", "*.md", "target/"]

[package.metadata.docs.rs]
# Build docs without the `python` feature: that feature requires a live Python
# interpreter and cannot be compiled in the docs.rs sandbox.
features = []
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "infercnasc"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python  = ["pyo3/extension-module", "pyo3/abi3-py310", "numpy"]

[dependencies]
ndarray   = { version = "0.16", features = ["rayon"] }
rayon     = "1.10"
thiserror = "1"
pyo3      = { version = "0.22", optional = true }
numpy     = { version = "0.22", optional = true }

[dev-dependencies]
approx = "0.5"
