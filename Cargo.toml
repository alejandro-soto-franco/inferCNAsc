[package]
name        = "infercnasc"
version     = "0.1.0"
edition     = "2021"
description = "Copy number alteration inference from scRNA-seq data"
license     = "MIT"
repository  = "https://github.com/alejandro-soto-franco/inferCNAsc"
keywords    = ["bioinformatics", "single-cell", "genomics", "CNA"]
categories  = ["science"]
exclude     = ["python/", "notebooks/", "tests/", ".github/", "docs/", "*.md", "target/"]

[lib]
name = "infercnasc"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python  = ["pyo3/extension-module", "pyo3/abi3-py310", "numpy"]

[dependencies]
ndarray   = { version = "0.16", features = ["rayon"] }
rayon     = "1.10"
thiserror = "1"
pyo3      = { version = "0.22", optional = true }
numpy     = { version = "0.22", optional = true }

[dev-dependencies]
approx = "0.5"
