[package]
name          = "infercnasc"
version       = "0.2.0"
edition       = "2024"
rust-version  = "1.85"
description   = "Copy number alteration inference from scRNA-seq data"
license       = "MIT"
repository    = "https://github.com/alejandro-soto-franco/inferCNAsc"
keywords      = ["bioinformatics", "single-cell", "genomics", "CNA"]
categories    = ["science"]
documentation = "https://docs.rs/infercnasc"
exclude       = ["python/", "notebooks/", "tests/", ".github/", "docs/", "*.md", "target/"]

[package.metadata.docs.rs]
features     = []
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name       = "infercnasc"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python  = ["pyo3/extension-module", "pyo3/abi3-py310", "numpy"]

[dependencies]
ndarray   = { version = "0.17", features = ["rayon"] }
rayon     = "1.10"
thiserror = "2"
pyo3      = { version = "0.28", optional = true }
numpy     = { version = "0.28", optional = true }

[dev-dependencies]
approx    = "0.5"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name    = "pipeline"
harness = false
